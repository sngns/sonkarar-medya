function tintMat(m, color, desat = 0, bright = 1) {
  const n = m.clone(); n.color = new THREE.Color(color);
  if (desat || bright !== 1) {
    n.onBeforeCompile = sh => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
        float lum = dot(diffuseColor.rgb, vec3(0.299,0.587,0.114));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(lum), ${desat.toFixed(2)}) * ${bright.toFixed(2)};`);
    };
    n.customProgramCacheKey = () => 'tint' + desat + bright;
  }
  return n;
}
function makePerson(cfg) {
  const o = SkeletonUtils.clone(gltf.scene);
  const bones = {}; o.traverse(n => { if (n.isBone) bones[n.name] = n; });
  o.traverse(n => {
    if (!n.isMesh) return; n.castShadow = true; n.receiveShadow = true; n.frustumCulled = false;
    const c = cfg[n.name]; if (c) n.material = tintMat(n.material, c[0], c[1] || 0, c[2] || 1);
    if (cfg.hide && cfg.hide.includes(n.name)) n.visible = false;
  });
  o.userData.bones = bones; o.userData.rest = {};
  for (const k in bones) o.userData.rest[k] = bones[k].quaternion.clone();
  return o;
}
const Q = new THREE.Quaternion(), E = new THREE.Euler();
function pose(person, rots) {
  const { bones, rest } = person.userData;
  for (const k in rest) bones[k].quaternion.copy(rest[k]);
  for (const k in rots) { const [x, y, z] = rots[k]; bones[k].quaternion.copy(rest[k]).multiply(Q.setFromEuler(E.set(x, y, z))); }
}

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _pq = new THREE.Quaternion(), _wq = new THREE.Quaternion();
function aim(person, name, child, dir) {
  const B = person.userData.bones; const b = B[name], c = B[child];
  person.updateMatrixWorld(true);
  b.getWorldPosition(_a); c.getWorldPosition(_b);
  const cur = _b.sub(_a).normalize();
  const want = new THREE.Vector3(...dir).normalize().applyQuaternion(person.quaternion);
  _q.setFromUnitVectors(cur, want);
  b.getWorldQuaternion(_wq); _wq.premultiply(_q);
  b.parent.getWorldQuaternion(_pq); b.quaternion.copy(_pq.invert().multiply(_wq));
}
function aimPose(person, list, rots = {}) {
  pose(person, rots);
  for (const [n, c, d] of list) aim(person, n, c, d);
}

}

// two-bone IK in world space
function ikArm(person, side, handW, poleW) {
  const B = person.userData.bones; person.updateMatrixWorld(true);
  const sh = new THREE.Vector3(), el = new THREE.Vector3(), wr = new THREE.Vector3();
  B[side + 'Arm'].getWorldPosition(sh); B[side + 'ForeArm'].getWorldPosition(el); B[side + 'Hand'].getWorldPosition(wr);
  const a = sh.distanceTo(el), b = el.distanceTo(wr);
  const toT = handW.clone().sub(sh); let d = Math.min(toT.length(), a + b - 0.001); const dir = toT.normalize();
  const cosA = (a * a + d * d - b * b) / (2 * a * d), ang = Math.acos(THREE.MathUtils.clamp(cosA, -1, 1));
  const pole = poleW.clone().sub(dir.clone().multiplyScalar(poleW.dot(dir))).normalize();
  const elbow = sh.clone().add(dir.clone().multiplyScalar(Math.cos(ang) * a)).add(pole.multiplyScalar(Math.sin(ang) * a));
  const inv = person.quaternion.clone().invert();
  const toLocal = v => v.clone().applyQuaternion(inv);
  aim(person, side + 'Arm', side + 'ForeArm', toLocal(elbow.clone().sub(sh)).toArray());
  aim(person, side + 'ForeArm', side + 'Hand', toLocal(handW.clone().sub(elbow)).toArray());
}
function fingers(side, c) { // c: {I,M,R,P,T}
  const sg = side === 'Left' ? -1 : 1, r = {};
  const map = { Index: c.I, Middle: c.M, Ring: c.R, Pinky: c.P };
  for (const f in map) for (let j = 1; j <= 3; j++) r[`${side}Hand${f}${j}`] = [0, 0, sg * map[f] * (j === 1 ? 1.1 : 1.3)];
  r[`${side}HandThumb2`] = [0, 0, sg * c.T * 0.5];
  return r;
}
const OPEN = { I: 0.08, M: 0.08, R: 0.1, P: 0.12, T: 0.05 }, FIST = { I: 1.35, M: 1.35, R: 1.35, P: 1.35, T: 1.2 }, POINT = { I: 0.0, M: 1.4, R: 1.4, P: 1.4, T: 1.0 }, GRIP = { I: 0.5, M: 0.6, R: 0.7, P: 0.8, T: 0.4 };
const HANDS = { // camera-space targets: [x,y,z], palm dir (camera space), curl
  open: { L: [-0.15, -0.2, -0.44], R: [0.15, -0.2, -0.44], pd: [0, 0.75, -0.65], fL: OPEN, fR: OPEN },
  fist: { L: [-0.14, -0.26, -0.40], R: [0.14, -0.26, -0.40], pd: [0, 0.35, -0.95], fL: FIST, fR: FIST },
  phone: { L: [-0.075, -0.25, -0.34], R: [0.075, -0.25, -0.34], pd: [0, 0.9, -0.45], fL: GRIP, fR: GRIP },
  pointL: { L: [-0.1, -0.2, -0.55], R: [0.16, -0.3, -0.38], pd: [-0.25, 0.2, -1], pdR: [0, 0.35, -0.95], fL: POINT, fR: FIST },
  pointR: { L: [-0.16, -0.3, -0.38], R: [0.1, -0.2, -0.55], pd: [0.25, 0.2, -1], pdL: [0, 0.35, -0.95], fL: FIST, fR: POINT },
};
// place player so its eyes are at camera
function placePOV(eye, target, poseName, t = 0) {
  const dir = new THREE.Vector3().subVectors(target, eye); const yaw = Math.atan2(dir.x, dir.z);
  player.rotation.set(0, yaw, 0); player.position.set(0, 0, 0);
  playerPose(poseName);
  player.position.set(0, 0, 0); player.updateMatrixWorld(true);
  const head = new THREE.Vector3(); player.userData.bones.Head.getWorldPosition(head);
  const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const bob = Math.sin(t * 2.2) * 0.012;
  player.position.set(eye.x - head.x - fwd.x * 0.06, eye.y - head.y - 0.07 + bob, eye.z - head.z - fwd.z * 0.06);
  camera.position.copy(eye); camera.lookAt(target); camera.updateMatrixWorld(true);
  const H = HANDS[poseName]; if (!H) return;
  pose(player, { ...fingers('Left', H.fL), ...fingers('Right', H.fR) });
  const sway = Math.sin(t * 1.7) * 0.01;
  for (const [side, p] of [['Left', H.L], ['Right', H.R]]) {
    const hw = new THREE.Vector3(p[0] + sway, p[1] + bob, p[2]).applyMatrix4(camera.matrixWorld);
    const pole = new THREE.Vector3(side === 'Left' ? -0.6 : 0.6, -1, 0.2).transformDirection(camera.matrixWorld);
    ikArm(player, side, hw, pole);
    const pdv = (side === 'Left' ? H.pdL : H.pdR) || H.pd;
    const pd = new THREE.Vector3(...pdv).transformDirection(camera.matrixWorld).applyQuaternion(player.quaternion.clone().invert());
    aim(player, side + 'Hand', side + 'HandMiddle1', pd.toArray());
  }
}

  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))+seed)*43758.5453); }
  void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
    float l = dot(c, vec3(0.299,0.587,0.114));
    c = mix(vec3(l), c, 1.12);
    vec3 sh = vec3(0.92,0.98,1.06), hi = vec3(1.06,1.01,0.92);

    c += (h(vUv*1000.0)-0.5)*0.018;

});

// ---------- timeline
const TM = { s1: 0, s2: 3.6, s3: 7.2, s4: 9.4, s5: 13.4, s6: 16.4, s7: 20.0, s8: 23.0 };
window.setTiming = o => Object.assign(TM, o);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const lerpV = (a, b, k) => a.clone().lerp(b, k);
const SH = {
  stop: [V(1.0, 1.68, 12.6), V(6.5, 1.2, 3.0)],
  busArr: [V(1.0, 1.68, 12.6), V(4.0, 1.5, 2.0)],
  old0: [V(-0.9, 1.68, 13.4), V(-3.0, 0.75, 10.0)],
  old1: [V(-1.5, 1.6, 12.4), V(-3.0, 0.85, 10.0)],
  bus2: [V(-0.4, 1.68, 12.8), V(3.0, 1.9, 2.0)],
  wide: [V(-1.2, 1.8, 15.5), V(-1.5, 0.9, 6.5)],
};
function busX(t) { return t < TM.s2 ? 60 : 1.0 + (40 - 1.0) * (1 - ease((t - TM.s2) / 2.8)); }
window.renderFrame = (t) => {
  let eye, tgt, hp = 'open', shake = 0;
  if (t < TM.s2) { [eye, tgt] = SH.stop; hp = 'fist'; }
  else if (t < TM.s3) { const k = ease((t - TM.s2) / 0.8); eye = SH.stop[0]; const bt = V(Math.max(4.0, busX(t) + 2.5), 1.6, 2.0); tgt = lerpV(SH.stop[1], bt, k); hp = 'fist'; }
  else if (t < TM.s5) {
    const k = ease((t - TM.s3) / 0.35), k2 = ease((t - TM.s3) / (TM.s5 - TM.s3));
    eye = lerpV(lerpV(SH.busArr[0], SH.old0[0], k), SH.old1[0], k2 * 0.8); tgt = lerpV(lerpV(SH.busArr[1], SH.old0[1], k), SH.old1[1], k2 * 0.8);
    shake = Math.max(0, 1 - (t - TM.s3) / 0.6);
  }
  else if (t < TM.s6) { const k = ease((t - TM.s5) / 0.35); eye = lerpV(SH.old1[0], SH.bus2[0], k); tgt = lerpV(SH.old1[1], SH.bus2[1], k); hp = 'fist'; }
  else { const k = ease((t - TM.s6) / 1.0); eye = lerpV(SH.bus2[0], SH.wide[0], k); tgt = lerpV(SH.bus2[1], SH.wide[1], k); shake = 0.15;
    if (t >= TM.s7) hp = t < (TM.s7 + TM.s8) / 2 ? 'pointL' : 'pointR'; }
  camera.fov = t >= TM.s6 ? 64 + 11 * ease((t - TM.s6) / 1.0) : 64; camera.updateProjectionMatrix();
  const j = shake * 0.03; tgt = tgt.clone().add(V(Math.sin(t * 37) * j, Math.cos(t * 41) * j, 0));
  bus.position.x = busX(t);
  oldPose(t > TM.s4 ? Math.min(1, 0.3 + (t - TM.s4) / 0.8) : 0.3);
  phone.visible = hp === 'phone';
  placePOV(eye, tgt, hp, t);
  bus.userData.blinker.material.emissiveIntensity = (t > TM.s2 + 2.8 && Math.floor(t * 3) % 2) ? 3 : 0;
  sun.target.position.set(eye.x, 0, eye.z - 8); sun.position.copy(sun.target.position).add(V(-30, 38, 26));
  grade.uniforms.seed.value = t;
  composer.render();
  return true;
};
